<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Users - CFWK</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/src/mapmaker/MapMaker.css">
    <link rel="stylesheet" href="/src/ui/shared.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--mm-bg-dark);
            color: var(--mm-text-main);
            font-family: 'Minecraft', sans-serif;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            border-bottom: 2px solid var(--mm-border);
            background: var(--mm-bg-panel);
            padding: 0.75rem 1rem;
        }

        .topbar-brand {
            color: var(--mm-primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.15rem;
        }

        .layout {
            display: grid;
            grid-template-columns: 230px 1fr;
            min-height: calc(100vh - 68px);
        }

        .sidebar {
            border-right: 2px solid var(--mm-border);
            background: var(--mm-bg-panel);
            padding: 0.8rem;
        }

        .sidebar-title {
            margin: 0 0 0.8rem;
            color: var(--mm-text-muted);
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sidebar-nav {
            display: grid;
            gap: 0.5rem;
        }

        .nav-item {
            border: 1px solid var(--mm-border);
            background: var(--mm-bg-input);
            color: var(--mm-text-main);
            padding: 0.6rem 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            text-decoration: none;
        }

        .nav-item.active {
            border-color: var(--mm-primary);
            color: #ffd7ea;
            background: rgba(255, 102, 170, 0.14);
        }

        .content {
            padding: 1rem;
            display: grid;
            gap: 0.9rem;
            align-content: start;
        }

        .section-card {
            border: 2px solid var(--mm-border);
            background: var(--mm-bg-panel);
            padding: 0.9rem;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 0.8rem;
            align-items: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }

        .toolbar h1 {
            margin: 0;
            font-size: 1.35rem;
            color: var(--mm-primary);
        }

        .filters-shell {
            display: grid;
            gap: 0.6rem;
        }

        .search-row {
            display: grid;
            grid-template-columns: minmax(260px, 1.4fr) repeat(2, minmax(120px, 0.3fr)) minmax(110px, 0.2fr);
            gap: 0.55rem;
            align-items: end;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(120px, 1fr));
            gap: 0.55rem;
            align-items: end;
        }

        .filter-cell {
            display: grid;
            gap: 0.3rem;
        }

        .filter-cell label {
            color: var(--mm-text-muted);
            font-size: 0.8rem;
        }

        .players-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.55rem;
            padding-right: 0.1rem;
        }

        .player-card {
            border: 1px solid var(--mm-border);
            background: rgba(255, 255, 255, 0.02);
            padding: 0.65rem;
            display: grid;
            gap: 0.45rem;
            cursor: pointer;
        }

        .player-card:hover,
        .player-card.active {
            border-color: var(--mm-primary);
            background: rgba(255, 102, 170, 0.12);
        }

        .player-head {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            align-items: baseline;
            flex-wrap: wrap;
        }

        .player-name {
            margin: 0;
            font-size: 0.95rem;
            color: #fff0f8;
        }

        .player-sub {
            margin: 0;
            color: var(--mm-text-muted);
            font-size: 0.78rem;
            word-break: break-all;
        }

        .pill-row {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
        }

        .pill {
            border: 1px solid var(--mm-border);
            padding: 0.1rem 0.35rem;
            font-size: 0.75rem;
            color: var(--mm-text-muted);
        }

        .pill.online {
            border-color: #49d178;
            color: #49d178;
        }

        .pill.bad {
            border-color: var(--mm-danger);
            color: #ffc4c4;
        }

        .pagination {
            margin-top: 0.75rem;
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .muted {
            color: var(--mm-text-muted);
        }

        .forbidden {
            display: none;
            border: 2px solid var(--mm-danger);
            background: rgba(213, 58, 58, 0.12);
            color: #ffbcbc;
            padding: 1rem;
        }

        .forbidden.show {
            display: block;
            margin: 1rem;
        }

        .pane-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            opacity: 0;
            pointer-events: none;
            transition: opacity 120ms ease;
            z-index: 40;
        }

        .pane-backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }

        .floating-pane {
            position: fixed;
            top: 12px;
            right: 12px;
            bottom: 12px;
            width: min(760px, 95vw);
            border: 2px solid var(--mm-border);
            background: var(--mm-bg-panel);
            z-index: 41;
            display: grid;
            grid-template-rows: auto auto 1fr;
            transform: translateX(105%);
            transition: transform 120ms ease;
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.45);
        }

        .floating-pane.show {
            transform: translateX(0);
        }

        .pane-header {
            padding: 0.8rem;
            border-bottom: 1px solid var(--mm-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.65rem;
            flex-wrap: wrap;
        }

        .pane-title {
            margin: 0;
            color: #ffe1f2;
            font-size: 1rem;
        }

        .tab-row {
            display: flex;
            gap: 0.5rem;
            border-bottom: 1px solid var(--mm-border);
            padding: 0.6rem 0.8rem;
        }

        .tab-row .mm-btn.active {
            border-color: var(--mm-primary);
            color: #ffd7ea;
            background: rgba(255, 102, 170, 0.14);
        }

        .pane-body {
            overflow: auto;
            padding: 0.8rem;
        }

        .tab-panel {
            display: none;
            gap: 0.65rem;
        }

        .tab-panel.show {
            display: grid;
        }

        .form-grid {
            display: grid;
            gap: 0.55rem;
        }

        .form-row {
            display: grid;
            gap: 0.28rem;
        }

        .form-row label {
            color: var(--mm-text-muted);
            font-size: 0.8rem;
        }

        .json-input {
            min-height: 120px;
            resize: vertical;
        }

        .actions-row {
            display: flex;
            gap: 0.45rem;
            flex-wrap: wrap;
        }

        .status-text {
            margin: 0;
            min-height: 1.2rem;
            color: var(--mm-text-muted);
            font-size: 0.8rem;
        }

        @media (max-width: 1200px) {
            .search-row {
                grid-template-columns: repeat(2, minmax(180px, 1fr));
            }
            .filters-grid {
                grid-template-columns: repeat(3, minmax(120px, 1fr));
            }
        }

        @media (max-width: 880px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                border-right: none;
                border-bottom: 2px solid var(--mm-border);
            }

            .filters-grid {
                grid-template-columns: repeat(2, minmax(120px, 1fr));
            }

            .floating-pane {
                top: 0;
                right: 0;
                bottom: 0;
                width: 100vw;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="/launch" class="topbar-brand"><i class="fa-solid fa-shield-halved"></i> CFWK Admin</a>
        <div style="display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;">
            <a class="mm-btn mm-btn-secondary" href="/launch"><i class="fa-solid fa-rocket"></i> Launch</a>
            <button id="logout-btn" class="mm-btn mm-btn-danger" type="button"><i class="fa-solid fa-right-from-bracket"></i> Log Out</button>
        </div>
    </header>

    <div id="forbidden" class="forbidden">
        <strong>Forbidden:</strong> this dashboard requires the `game.admin` permission.
    </div>

    <main id="app-layout" class="layout">
        <aside class="sidebar">
            <p class="sidebar-title">Admin Panel</p>
            <nav class="sidebar-nav">
                <a class="nav-item" href="/admin"><i class="fa-solid fa-newspaper"></i> Posts</a>
                <a class="nav-item active" href="/admin/users"><i class="fa-solid fa-users"></i> Users</a>
            </nav>
        </aside>

        <section class="content">
            <div class="section-card">
                <div class="toolbar">
                    <h1>User Management</h1>
                </div>

                <form id="filters-form" class="filters-shell">
                    <div class="search-row">
                        <div class="filter-cell">
                            <label for="q-input">Search</label>
                            <input id="q-input" class="mm-input" type="text" placeholder="username, email, id, ip">
                        </div>
                        <div class="filter-cell">
                            <label for="sort-by-input">Sort By</label>
                            <select id="sort-by-input" class="mm-input">
                                <option value="updatedAt">Updated</option>
                                <option value="createdAt">Created</option>
                                <option value="username">Username</option>
                                <option value="money">Money</option>
                                <option value="bannedUntil">Ban Until</option>
                                <option value="mutedUntil">Mute Until</option>
                                <option value="distanceWalked">Distance Walked</option>
                                <option value="distanceRan">Distance Ran</option>
                                <option value="timeOnlineMs">Time Online</option>
                                <option value="catches">Catches</option>
                                <option value="npcInteractions">NPC Interactions</option>
                            </select>
                        </div>
                        <div class="filter-cell">
                            <label for="sort-dir-input">Direction</label>
                            <select id="sort-dir-input" class="mm-input">
                                <option value="desc">Desc</option>
                                <option value="asc">Asc</option>
                            </select>
                        </div>
                        <div class="filter-cell">
                            <label>&nbsp;</label>
                            <div style="display:flex;gap:0.45rem;">
                                <button id="apply-filters-btn" class="mm-btn" type="submit"><i class="fa-solid fa-filter"></i> Apply</button>
                                <button id="clear-filters-btn" class="mm-btn mm-btn-secondary" type="button">Clear</button>
                            </div>
                        </div>
                    </div>

                    <div class="filters-grid">
                        <div class="filter-cell">
                            <label for="permissions-input">Permissions (csv)</label>
                            <input id="permissions-input" class="mm-input" type="text" placeholder="game.admin,access.game">
                        </div>
                        <div class="filter-cell">
                            <label for="online-input">Online</label>
                            <select id="online-input" class="mm-input">
                                <option value="">Any</option>
                                <option value="online">Online</option>
                                <option value="offline">Offline</option>
                            </select>
                        </div>
                        <div class="filter-cell">
                            <label for="active-ban-input">Active Ban</label>
                            <select id="active-ban-input" class="mm-input">
                                <option value="">Any</option>
                                <option value="true">Banned</option>
                                <option value="false">Not Banned</option>
                            </select>
                        </div>
                        <div class="filter-cell">
                            <label for="active-mute-input">Active Mute</label>
                            <select id="active-mute-input" class="mm-input">
                                <option value="">Any</option>
                                <option value="true">Muted</option>
                                <option value="false">Not Muted</option>
                            </select>
                        </div>
                        <div class="filter-cell">
                            <label for="verified-input">Verified</label>
                            <select id="verified-input" class="mm-input">
                                <option value="">Any</option>
                                <option value="true">Verified</option>
                                <option value="false">Not Verified</option>
                            </select>
                        </div>
                        <div class="filter-cell">
                            <label for="demo-input">Demo</label>
                            <select id="demo-input" class="mm-input">
                                <option value="">Any</option>
                                <option value="true">Demo</option>
                                <option value="false">Normal</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>

            <div class="section-card">
                <p id="players-meta" class="muted">Loading players...</p>
                <div id="players-list" class="players-list"></div>
                <div class="pagination">
                    <div style="display:flex;gap:0.45rem;">
                        <button id="prev-page-btn" class="mm-btn mm-btn-secondary" type="button">Prev</button>
                        <button id="next-page-btn" class="mm-btn mm-btn-secondary" type="button">Next</button>
                    </div>
                    <p id="page-meta" class="muted">Page 1</p>
                </div>
            </div>
        </section>
    </main>

    <div id="pane-backdrop" class="pane-backdrop"></div>
    <aside id="floating-pane" class="floating-pane">
        <div class="pane-header">
            <div>
                <h2 class="pane-title">User Panel</h2>
                <p id="selected-meta" class="muted">Select a user to open details.</p>
            </div>
            <button id="close-pane-btn" class="mm-btn mm-btn-secondary" type="button"><i class="fa-solid fa-xmark"></i> Close</button>
        </div>

        <div class="tab-row">
            <button id="details-tab-btn" class="mm-btn active" type="button">Details</button>
            <button id="management-tab-btn" class="mm-btn mm-btn-secondary" type="button">Management</button>
        </div>

        <div class="pane-body">
            <section id="details-tab" class="tab-panel show">
                <form id="details-form" class="form-grid">
                    <div class="form-row"><label for="username-input">Username</label><input id="username-input" class="mm-input" type="text"></div>
                    <div class="form-row"><label for="email-input">Email</label><input id="email-input" class="mm-input" type="email"></div>
                    <div class="form-row"><label for="status-input">Status</label><input id="status-input" class="mm-input" type="text"></div>
                    <div class="form-row"><label for="permissions-detail-input">Permissions (csv)</label><input id="permissions-detail-input" class="mm-input" type="text"></div>
                    <div class="form-row"><label for="money-input">Money</label><input id="money-input" class="mm-input" type="number"></div>
                    <div class="form-row"><label for="location-input">Last Location ID</label><input id="location-input" class="mm-input" type="text"></div>
                    <div class="form-row"><label for="banned-until-input">Banned Until (ISO or empty)</label><input id="banned-until-input" class="mm-input" type="text"></div>
                    <div class="form-row"><label for="muted-until-input">Muted Until (ISO or empty)</label><input id="muted-until-input" class="mm-input" type="text"></div>
                    <div class="form-row"><label for="verified-checkbox"><input id="verified-checkbox" type="checkbox"> Verified</label></div>
                    <div class="form-row"><label for="demo-checkbox"><input id="demo-checkbox" type="checkbox"> Demo User</label></div>

                    <div class="form-row"><label for="settings-json-input">Settings (JSON)</label><textarea id="settings-json-input" class="mm-input json-input"></textarea></div>
                    <div class="form-row"><label for="stats-json-input">Player Stats (JSON)</label><textarea id="stats-json-input" class="mm-input json-input"></textarea></div>
                    <div class="form-row"><label for="hearts-json-input">Hearts (JSON)</label><textarea id="hearts-json-input" class="mm-input json-input"></textarea></div>
                    <div class="form-row"><label for="appearance-json-input">Character Appearance (JSON)</label><textarea id="appearance-json-input" class="mm-input json-input"></textarea></div>
                    <div class="form-row"><label for="advancements-json-input">Advancements (JSON)</label><textarea id="advancements-json-input" class="mm-input json-input"></textarea></div>
                    <div class="form-row"><label for="inventory-json-input">Inventory (JSON)</label><textarea id="inventory-json-input" class="mm-input json-input"></textarea></div>
                    <div class="form-row"><label for="glimmerbowl-json-input">Glimmerbowl (JSON)</label><textarea id="glimmerbowl-json-input" class="mm-input json-input"></textarea></div>

                    <div class="actions-row">
                        <button id="save-details-btn" class="mm-btn" type="submit"><i class="fa-solid fa-floppy-disk"></i> Save Details</button>
                    </div>
                </form>
                <p id="details-feedback" class="status-text"></p>
            </section>

            <section id="management-tab" class="tab-panel">
                <div class="form-row">
                    <label for="duration-input">Temp Duration (1d, 2h, 30m, 10s)</label>
                    <input id="duration-input" class="mm-input" type="text" value="1h">
                </div>
                <div class="form-row">
                    <label for="send-location-input">Send Destination</label>
                    <select id="send-location-input" class="mm-input"></select>
                </div>
                <div class="form-row">
                    <label for="wipe-confirm-input">Wipe Confirm (username or user id)</label>
                    <input id="wipe-confirm-input" class="mm-input" type="text">
                </div>
                <div class="actions-row">
                    <button id="ban-btn" class="mm-btn mm-btn-danger" type="button">Ban</button>
                    <button id="tempban-btn" class="mm-btn mm-btn-danger" type="button">Temp Ban</button>
                    <button id="mute-btn" class="mm-btn mm-btn-danger" type="button">Mute</button>
                    <button id="tempmute-btn" class="mm-btn mm-btn-danger" type="button">Temp Mute</button>
                    <button id="unban-btn" class="mm-btn mm-btn-secondary" type="button">Unban</button>
                    <button id="unmute-btn" class="mm-btn mm-btn-secondary" type="button">Unmute</button>
                    <button id="send-btn" class="mm-btn" type="button">Send</button>
                    <button id="wipe-btn" class="mm-btn mm-btn-danger" type="button">Wipe</button>
                </div>
                <p id="actions-feedback" class="status-text"></p>
            </section>
        </div>
    </aside>

    <script type="module" src="/src/admin-users.ts"></script>
</body>
</html>
