<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Tuner - CFWK Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/src/mapmaker/MapMaker.css">
    <link rel="stylesheet" href="/src/ui/shared.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--mm-bg-dark);
            color: var(--mm-text-main);
            font-family: 'Minecraft', sans-serif;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            border-bottom: 2px solid var(--mm-border);
            background: var(--mm-bg-panel);
            padding: 0.75rem 1rem;
        }

        .topbar-brand {
            color: var(--mm-primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.15rem;
        }

        .layout {
            display: grid;
            grid-template-columns: 230px 1fr;
            min-height: calc(100vh - 68px);
        }

        .sidebar {
            border-right: 2px solid var(--mm-border);
            background: var(--mm-bg-panel);
            padding: 0.8rem;
        }

        .sidebar-title {
            margin: 0 0 0.8rem;
            color: var(--mm-text-muted);
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sidebar-nav {
            display: grid;
            gap: 0.5rem;
        }

        .nav-item {
            border: 1px solid var(--mm-border);
            background: var(--mm-bg-input);
            color: var(--mm-text-main);
            padding: 0.6rem 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            text-decoration: none;
        }

        .nav-item.active {
            border-color: var(--mm-primary);
            color: #ffd7ea;
            background: rgba(255, 102, 170, 0.14);
        }

        .content {
            padding: 1rem;
            display: grid;
            gap: 0.9rem;
            align-content: start;
        }

        .section-card {
            border: 2px solid var(--mm-border);
            background: var(--mm-bg-panel);
            padding: 0.9rem;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 0.8rem;
            align-items: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }

        .toolbar h1 {
            margin: 0;
            font-size: 1.35rem;
            color: var(--mm-primary);
        }

        .controls-row {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            align-items: end;
            margin-bottom: 0.9rem;
        }

        .control-group {
            display: grid;
            gap: 0.25rem;
        }

        .control-group label {
            color: var(--mm-text-muted);
            font-size: 0.8rem;
        }

        .canvas-wrap {
            border: 2px solid var(--mm-border);
            background: #111118;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            min-height: 340px;
            position: relative;
            overflow: hidden;
        }

        #tuner-canvas {
            image-rendering: pixelated;
            cursor: grab;
        }

        #tuner-canvas:active {
            cursor: grabbing;
        }

        .offset-row {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
            align-items: end;
            margin-top: 0.9rem;
        }

        .offset-group {
            display: grid;
            gap: 0.25rem;
        }

        .offset-group label {
            color: var(--mm-text-muted);
            font-size: 0.8rem;
        }

        .offset-input-wrap {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .offset-input-wrap input {
            width: 70px;
            text-align: center;
        }

        .offset-input-wrap span {
            color: var(--mm-text-muted);
            font-size: 0.85rem;
        }

        .actions-row {
            display: flex;
            gap: 0.55rem;
            align-items: center;
        }

        .muted {
            color: var(--mm-text-muted);
        }

        .forbidden {
            display: none;
            border: 2px solid var(--mm-danger);
            background: rgba(213, 58, 58, 0.12);
            color: #ffbcbc;
            padding: 1rem;
        }

        .forbidden.show {
            display: block;
            margin: 1rem;
        }

        .hint {
            color: var(--mm-text-muted);
            font-size: 0.78rem;
            margin: 0.4rem 0 0;
        }

        .copy-feedback {
            color: #49d178;
            font-size: 0.82rem;
            opacity: 0;
            transition: opacity 200ms ease;
        }

        .copy-feedback.show {
            opacity: 1;
        }

        .playback-row {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            align-items: end;
            margin-bottom: 0.5rem;
        }

        .frame-scrubber {
            display: grid;
            gap: 0.2rem;
            flex: 1;
            min-width: 140px;
        }

        .frame-scrubber label {
            color: var(--mm-text-muted);
            font-size: 0.78rem;
            display: flex;
            justify-content: space-between;
        }

        .frame-scrubber input[type="range"] {
            width: 100%;
        }

        @media (max-width: 880px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                border-right: none;
                border-bottom: 2px solid var(--mm-border);
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="/launch" class="topbar-brand"><i class="fa-solid fa-shield-halved"></i> CFWK Admin</a>
        <div style="display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;">
            <a class="mm-btn mm-btn-secondary" href="/launch"><i class="fa-solid fa-rocket"></i> Launch</a>
            <button id="logout-btn" class="mm-btn mm-btn-danger" type="button"><i class="fa-solid fa-right-from-bracket"></i> Log Out</button>
        </div>
    </header>

    <div id="forbidden" class="forbidden">
        <strong>Forbidden:</strong> this dashboard requires the `game.admin` permission.
    </div>

    <main id="app-layout" class="layout">
        <aside class="sidebar">
            <p class="sidebar-title">Admin Panel</p>
            <nav class="sidebar-nav">
                <a class="nav-item" href="/admin"><i class="fa-solid fa-newspaper"></i> Posts</a>
                <a class="nav-item" href="/admin/users"><i class="fa-solid fa-users"></i> Users</a>
                <a class="nav-item active" href="/admin/sprite-tuner"><i class="fa-solid fa-crosshairs"></i> Sprite Tuner</a>
            </nav>
        </aside>

        <section class="content">
            <div class="section-card">
                <div class="toolbar">
                    <h1>Sprite Offset Tuner</h1>
                </div>

                <div class="controls-row">
                    <div class="control-group">
                        <label for="kind-select">Character</label>
                        <select id="kind-select" class="mm-input"></select>
                    </div>
                    <div class="control-group">
                        <label for="overlay-select">Overlay State</label>
                        <select id="overlay-select" class="mm-input">
                            <option value="walk">walk</option>
                            <option value="attack" selected>attack</option>
                            <option value="death">death</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="opacity-range">Overlay Opacity</label>
                        <input id="opacity-range" type="range" min="10" max="100" value="55" class="mm-input" style="width:140px;">
                    </div>
                    <div class="control-group">
                        <label for="zoom-select">Zoom</label>
                        <select id="zoom-select" class="mm-input">
                            <option value="2">2x</option>
                            <option value="4" selected>4x</option>
                            <option value="6">6x</option>
                            <option value="8">8x</option>
                        </select>
                    </div>
                </div>

                <div class="playback-row">
                    <div class="control-group">
                        <label>&nbsp;</label>
                        <button id="play-pause-btn" class="mm-btn mm-btn-secondary" type="button" style="min-width:80px;"><i class="fa-solid fa-pause"></i> Pause</button>
                    </div>
                    <div class="frame-scrubber">
                        <label>Idle Frame <span id="idle-frame-label">0/0</span></label>
                        <input id="idle-frame-range" type="range" min="0" max="0" value="0">
                    </div>
                    <div class="frame-scrubber">
                        <label>Overlay Frame <span id="overlay-frame-label">0/0</span></label>
                        <input id="overlay-frame-range" type="range" min="0" max="0" value="0">
                    </div>
                </div>

                <div class="canvas-wrap">
                    <canvas id="tuner-canvas" width="600" height="400"></canvas>
                </div>

                <p class="hint">Drag the overlay to align it with the idle. Arrow keys nudge by 1px (hold Shift for 5px). Space to play/pause.</p>

                <div class="offset-row">
                    <div class="offset-group">
                        <label for="offset-x-input">Offset X</label>
                        <div class="offset-input-wrap">
                            <input id="offset-x-input" class="mm-input" type="number" value="0">
                            <span>px</span>
                        </div>
                    </div>
                    <div class="offset-group">
                        <label for="offset-y-input">Offset Y</label>
                        <div class="offset-input-wrap">
                            <input id="offset-y-input" class="mm-input" type="number" value="0">
                            <span>px</span>
                        </div>
                    </div>
                    <div class="actions-row">
                        <button id="reset-btn" class="mm-btn mm-btn-secondary" type="button"><i class="fa-solid fa-rotate-left"></i> Reset</button>
                        <button id="copy-btn" class="mm-btn" type="button"><i class="fa-solid fa-copy"></i> Copy Config</button>
                        <span id="copy-feedback" class="copy-feedback">Copied!</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="/src/admin-sprite-tuner.ts"></script>
</body>
</html>
